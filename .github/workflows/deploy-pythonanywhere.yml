name: Deploy to PythonAnywhere (recursive upload)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Secrets are exposed as environment variables rather than interpolated
    # into the scripts below. Two reasons:
    #   - `${{ secrets.X }}` is substituted before bash runs, so an empty
    #     secret silently becomes an empty literal and `set -u` never fires;
    #   - a secret containing a quote or a `;` would be executed as code.
    # Referenced as "$PA_USERNAME" etc., the shell sees plain data.
    env:
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_TOKEN: ${{ secrets.PA_TOKEN }}
      PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
      PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
      # Optional: set the PA_HOST secret to "eu.pythonanywhere.com" if your
      # account is on the EU cluster.
      PA_HOST: ${{ secrets.PA_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in PA_USERNAME PA_TOKEN PA_TARGET_DIR PA_WEBAPP_DOMAIN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Secret(s) manquant(s) ou vide(s) : ${missing[*]}"
            echo "A creer dans Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

          # Format checks: these two mistakes produce a malformed API URL and
          # an error message that says nothing useful.
          if [[ "$PA_TARGET_DIR" != /* ]]; then
            echo "::error::PA_TARGET_DIR doit etre un chemin absolu, par exemple /home/monuser/myapp (valeur recue : ${PA_TARGET_DIR})"
            exit 1
          fi
          if [[ "$PA_WEBAPP_DOMAIN" == *://* || "$PA_WEBAPP_DOMAIN" == */* ]]; then
            echo "::error::PA_WEBAPP_DOMAIN doit etre un nom de domaine seul, sans https:// ni chemin, par exemple monuser.pythonanywhere.com (valeur recue : ${PA_WEBAPP_DOMAIN})"
            exit 1
          fi

          echo "Les 4 secrets requis sont presents et bien formes."

      - name: Upload all files recursively (dirs auto-created by Files API)
        shell: bash
        run: |
          set -euo pipefail

          RESP="$(mktemp)"
          trap 'rm -f "$RESP"' EXIT

          HOST="${PA_HOST:-}"
          if [[ -z "$HOST" ]]; then HOST="www.pythonanywhere.com"; fi

          # Trailing slashes would produce a double slash in the API path.
          TARGET_DIR="${PA_TARGET_DIR%/}"

          echo "Using PythonAnywhere host: ${HOST}"
          echo "Target directory: ${TARGET_DIR}"

          # Upload every file; remote directories are created automatically by the Files API.
          while IFS= read -r -d '' file; do
            rel="${file#./}"

            # Exclusions (adjust to taste)
            case "$rel" in
              .git/*|.github/*|.venv/*|__pycache__/*|node_modules/*) continue ;;
              *.pyc|.DS_Store) continue ;;
            esac

            remote_path="${TARGET_DIR}/${rel}"
            echo " - ${rel} -> ${remote_path}"

            # No --fail here: it hides the response body, and the body is the
            # only place the API explains what it refused.
            status="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST \
              -H "Authorization: Token ${PA_TOKEN}" \
              -F "content=@${file}" \
              "https://${HOST}/api/v0/user/${PA_USERNAME}/files/path${remote_path}")"

            if [[ "$status" != 2* ]]; then
              echo "::error::Envoi de ${rel} refuse (HTTP ${status})"
              echo "Reponse de l'API :"; cat "$RESP"; echo
              exit 1
            fi

          done < <(
            find . \
              -type d \( -name .git -o -name .github -o -name .venv -o -name __pycache__ -o -name node_modules \) -prune -false \
              -o -type f \
                ! -name ".DS_Store" \
                ! -name "*.pyc" \
                -print0
          )

          echo "Reloading webapp ${PA_WEBAPP_DOMAIN}..."

          # A 409 often just means a reload is already running, so retry a few
          # times before giving up. Any other status is final.
          status=""
          for attempt in 1 2 3; do
            status="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST \
              -H "Authorization: Token ${PA_TOKEN}" \
              "https://${HOST}/api/v0/user/${PA_USERNAME}/webapps/${PA_WEBAPP_DOMAIN}/reload/")"

            if [[ "$status" == 2* ]]; then break; fi

            echo "Tentative ${attempt}/3 : HTTP ${status}"
            echo "Reponse de l'API :"; cat "$RESP"; echo
            if [[ "$status" != "409" ]]; then break; fi
            sleep 10
          done

          if [[ "$status" != 2* ]]; then
            echo "::error::Rechargement de la webapp refuse (HTTP ${status})"
            case "$status" in
              403) echo "Cause probable : PA_TOKEN invalide ou revoque (PythonAnywhere -> Account -> API Token)." ;;
              404) echo "Cause probable : PA_WEBAPP_DOMAIN ne correspond a aucune webapp. Valeur attendue : monuser.pythonanywhere.com" ;;
              409) echo "Cause probable : la webapp est expiree. Sur un compte gratuit, PythonAnywhere la desactive tous les 3 mois."
                   echo "Allez dans l'onglet Web et cliquez sur le bouton 'Run until 3 months from today', puis relancez ce workflow." ;;
            esac
            echo "Les fichiers ont bien ete envoyes : seul le rechargement a echoue."
            exit 1
          fi

          echo "Deployed. Try: https://${PA_WEBAPP_DOMAIN}/"
